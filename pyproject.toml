[project]
name = "smolvlm-ft"
version = "0.1.0"
description = "LoRA fine-tuning of SmolVLM2-500M-Video-Instruct on the DCSASS violence-detection dataset, with MLflow tracking"
readme = "README.md"
requires-python = ">=3.13,<=3.15"
dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21",
    "transformers>=4.57,<5",
    "accelerate>=1.0",
    "peft>=0.17,<1",
    "trl==1.0.0",
    "datasets>=3.6,<6",
    "pyarrow>=15",
    "decord==0.6.0",
    "av>=12",
    "dvc>=3.50,<4",
    # Full mlflow, not `mlflow-tracing` alone: the OpenAI-compatible AI Gateway
    # route (/gateway/mlflow/v1) and mlflow.autolog()'s openai integration both
    # live in the main package.
    "mlflow>=2.20,<4",
    # Client for the gateway's OpenAI-compatible chat endpoint (caption generation).
    "openai>=1.40,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sentencepiece>=0.2",
    "huggingface-hub>=0.30",
    "safetensors>=0.4",
    "num2words>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
smolvlm-ft = "smolvlm_ft.train:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smolvlm_ft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"